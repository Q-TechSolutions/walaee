# ══════════════════════════════════════════════════════════
#  الحافة — بين الإنترنت والتطبيق.
#
#  TLS تتولاه Traefik داخل Dokploy فلا شهادات هنا.
#  المرجع: docs/architecture/deployment.md
# ══════════════════════════════════════════════════════════

# يختار بروتوكول الطلب الأصلي: ما أرسله الوكيل الخارجي إن وُجد،
# وإلا بروتوكولنا نحن. راجع التعليق في proxy_headers.conf
map $http_x_forwarded_proto $walaee_forwarded_proto {
    default $scheme;
    "~^https?$" $http_x_forwarded_proto;
}

upstream walaee_api {
    server api:8000;
    keepalive 32;
}

# تحديد المعدل على الحافة: الطلب المرفوض هنا لا يستهلك عاملًا في
# التطبيق ولا اتصالًا بقاعدة البيانات.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=1r/s;

server {
    listen 80;
    # بعض البيئات توجّه عبر IPv6؛ الاستماع على الاثنين يتجنّب
    # «connection refused» يعتمد على ترتيب حلّ الأسماء
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8m;

    # خلف وكيل: التحويل المطلق يفقد النطاق والمنفذ ويرسل المستخدم
    # إلى عنوان داخلي لا يراه من الإنترنت
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/css text/plain
               image/svg+xml application/manifest+json application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # ── فحص صحي للحاوية نفسها ──
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── فحص صحي للتطبيق ──
    location = /healthz {
        access_log off;
        proxy_pass http://walaee_api;
        include /etc/nginx/proxy_headers.conf;
    }

    # ── المصادقة: حد صارم — هذا مسار إرسال الرسائل ──
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://walaee_api;
        include /etc/nginx/proxy_headers.conf;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── باقي الواجهات ──
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://walaee_api;
        include /etc/nginx/proxy_headers.conf;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /django-admin/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://walaee_api;
        include /etc/nginx/proxy_headers.conf;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── ملفات Django الثابتة والوسائط ──
    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ══════════════ الواجهات ══════════════
    #
    # أصول Vite تحمل بصمة محتوى في أسمائها، فالتخزين الأبدي آمن
    # لها. أما ملفات index.html فلا تُخزَّن إطلاقًا: تخزينها يعني
    # مستخدمًا عالقًا على نسخة قديمة تطلب أصولًا حُذفت — صفحة
    # بيضاء بلا أي خطأ يشرح نفسه.

    location ~* ^/(merchant|admin)/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # لوحة إدارة المنصة — واجهة داخلية لا تُفهرَس
    location /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /admin/index.html;
    }

    location /merchant/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /merchant/index.html;
    }

    # ── عامل الخدمة: لا يُخزَّن أبدًا ──
    # نسخة قديمة منه تُثبّت نفسها وتخدم أصولًا محذوفة إلى الأبد
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
    }

    # ── تطبيق العميل على الجذر ──
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
