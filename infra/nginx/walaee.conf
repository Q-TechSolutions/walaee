# ══════════════════════════════════════════════════════════
#  الوكيل العكسي — الحافة بين الإنترنت والتطبيق
#  المرجع: docs/architecture/deployment.md
#  TLS تتولاه Traefik داخل Dokploy، فلا شهادات هنا.
# ══════════════════════════════════════════════════════════

upstream walaee_api {
    server api:8000;
    keepalive 32;
}

# تحديد المعدل على الحافة: الطلب المرفوض هنا لا يستهلك عاملًا
# في التطبيق ولا اتصالًا بقاعدة البيانات.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=1r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/css text/plain
               image/svg+xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # ── الفحص الصحي: بلا تحديد معدل وبلا سجل ──
    location = /healthz {
        access_log off;
        proxy_pass http://walaee_api;
        proxy_set_header Host $host;
    }

    # ── المصادقة: حد صارم — هذا مسار إرسال الرسائل ──
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://walaee_api;
        include /etc/nginx/proxy_headers.conf;
    }

    # ── باقي الواجهات ──
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://walaee_api;
        include /etc/nginx/proxy_headers.conf;
    }

    location /django-admin/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://walaee_api;
        include /etc/nginx/proxy_headers.conf;
    }

    # ── الملفات الثابتة والوسائط: من القرص لا من التطبيق ──
    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
