# ══════════════════════════════════════════════════════════
#  الحافة — بين الإنترنت والتطبيق.
#
#  TLS تتولاه Traefik داخل Dokploy فلا شهادات هنا.
#  المرجع: docs/architecture/deployment.md
# ══════════════════════════════════════════════════════════

# يختار بروتوكول الطلب الأصلي: ما أرسله الوكيل الخارجي إن وُجد،
# وإلا بروتوكولنا نحن. راجع التعليق في proxy_headers.conf
map $http_x_forwarded_proto $walaee_forwarded_proto {
    default $scheme;
    "~^https?$" $http_x_forwarded_proto;
}

# ══════════════════════════════════════════════════════════
#  حلّ اسم الخلفية في وقت الطلب لا عند الإقلاع.
#
#  nginx المفتوح يحلّ أسماء `upstream` مرة واحدة عند بدء التشغيل
#  ويحتفظ بالعنوان إلى الأبد. وحاوية تُعاد إنشاؤها في كل نشر تأخذ
#  عنوانًا جديدًا — فيظل nginx يطرق عنوانًا ميتًا ويردّ 502 على كل
#  طلب، بينما الخلفية «صحيّة» في كل لوحة. العلاج الوحيد كان إعادة
#  تشغيل الحافة يدويًا بعد كل نشر.
#
#  تمرير العنوان عبر متغيّر يجبر nginx على استشارة DNS في كل طلب.
#  ‏127.0.0.11 هو محلّل Docker الداخلي.
#
#  الثمن: فقدان `keepalive` لأنه يحتاج كتلة upstream ثابتة. مقايضة
#  مقبولة — اتصال إضافي لكل طلب أرخص بكثير من انقطاع كامل بعد كل نشر.
# ══════════════════════════════════════════════════════════
resolver 127.0.0.11 valid=10s ipv6=off;

# تحديد المعدل على الحافة: الطلب المرفوض هنا لا يستهلك عاملًا في
# التطبيق ولا اتصالًا بقاعدة البيانات.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=1r/s;

# ‏429 لا ٥٠٣ الافتراضي. ٥٠٣ يعني «الخدمة معطّلة» فيظن العميل أن
# الخادم واقع ويعيد المحاولة بقوة — وهو أسوأ رد فعل ممكن على
# تجاوز حد معدل. ‏429 يقول ما حدث فعلًا، ويطابق ما تردّه طبقة
# التطبيق لحدودها هي، فتتعامل الواجهة مع الحالتين بمنطق واحد.
limit_req_status 429;

server {
    listen 80;
    # بعض البيئات توجّه عبر IPv6؛ الاستماع على الاثنين يتجنّب
    # «connection refused» يعتمد على ترتيب حلّ الأسماء
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8m;

    # خلف وكيل: التحويل المطلق يفقد النطاق والمنفذ ويرسل المستخدم
    # إلى عنوان داخلي لا يراه من الإنترنت
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/css text/plain
               image/svg+xml application/manifest+json application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # ══════════════════════════════════════════════════════
    #  تحدّي Let's Encrypt — أول ما يُطابَق وبلا أي قيد.
    #
    #  ‏Traefik يتولى TLS عادةً، لكن بعض التركيبات تمرّر التحدّي
    #  إلى الحاوية. وأي قاعدة تمنعه — تحديد معدل، أو منع الملفات
    #  التي تبدأ بنقطة وهو ما يطابق `/.well-known/` حرفيًا — تجعل
    #  إصدار الشهادة يفشل بـ403 بينما كل شيء آخر يعمل. العرَض:
    #  نطاق يبقى على http بلا سبب ظاهر، والسجل يقول
    #  «access forbidden by rule» على مسار لا يعرفه أحد.
    # ══════════════════════════════════════════════════════
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
        try_files $uri =404;
    }

    # ── فحص صحي للحاوية نفسها ──
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── فحص صحي للتطبيق ──
    location = /healthz {
        access_log off;
        set $walaee_api api:8000;
        proxy_pass http://$walaee_api;
        include /etc/nginx/proxy_headers.conf;
    }

    # ── المصادقة: حد صارم — هذا مسار إرسال الرسائل ──
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        set $walaee_api api:8000;
        proxy_pass http://$walaee_api;
        include /etc/nginx/proxy_headers.conf;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── باقي الواجهات ──
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        set $walaee_api api:8000;
        proxy_pass http://$walaee_api;
        include /etc/nginx/proxy_headers.conf;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /django-admin/ {
        limit_req zone=api_general burst=20 nodelay;
        set $walaee_api api:8000;
        proxy_pass http://$walaee_api;
        include /etc/nginx/proxy_headers.conf;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── ملفات Django الثابتة والوسائط ──
    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ══════════════ الواجهات ══════════════
    #
    # أصول Vite تحمل بصمة محتوى في أسمائها، فالتخزين الأبدي آمن
    # لها. أما ملفات index.html فلا تُخزَّن إطلاقًا: تخزينها يعني
    # مستخدمًا عالقًا على نسخة قديمة تطلب أصولًا حُذفت — صفحة
    # بيضاء بلا أي خطأ يشرح نفسه.

    location ~* ^/(app|merchant|admin)/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # أصول الصفحة العامة على الجذر
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # لوحة إدارة المنصة — واجهة داخلية لا تُفهرَس
    location /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /admin/index.html;
    }

    location /merchant/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /merchant/index.html;
    }

    # ── عامل الخدمة: لا يُخزَّن أبدًا ──
    # نسخة قديمة منه تُثبّت نفسها وتخدم أصولًا محذوفة إلى الأبد.
    # مكانه داخل /app/ لأن نطاق العامل لا يتجاوز مساره: عامل على
    # الجذر كان سيعترض طلبات الصفحة العامة ولوحة التاجر أيضًا.
    location = /app/sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /app/manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
    }

    # عامل الخدمة القديم كان على الجذر، وهو مثبَّت الآن في متصفّح
    # كل من فتح النسخة السابقة. ‏410 تجعل المتصفّح يلغي تسجيله بدل
    # أن يظل يخدم نسخة قديمة من تطبيق لم يعد على هذا المسار.
    location = /sw.js {
        add_header Cache-Control "no-store" always;
        return 410;
    }

    # ── تطبيق العميل ──
    location /app/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /app/index.html;
    }

    # من حفظ الجذر في شاشته الرئيسية قبل النقل يصل إلى الصفحة
    # العامة لا إلى تطبيقه. ‏302 لا 301: التحويل الدائم يُخزَّن في
    # المتصفّح إلى الأبد ويصير تراجعه مستحيلًا لو نُقل المسار ثانيةً.
    location = /login {
        return 302 /app/login;
    }

    # ══════════════════════════════════════════════════════
    #  العرض التفاعلي — HTML ثابت لا علاقة له بالتطبيق.
    #
    #  يُخدَم من نفس الحاوية عمدًا: هو التصميم المعتمد الذي تُقاس
    #  عليه الشاشات، ومن يفتح رابط المشروع يحتاج أن يرى الاثنين
    #  جنبًا إلى جنب بلا نشر ثانٍ ولا نطاق آخر.
    #
    #  `noindex` لأنه واجهات مرسومة ببيانات ثابتة: فهرستها تضع
    #  أرقامًا مختلَقة في نتائج البحث باسم المنصة.
    # ══════════════════════════════════════════════════════
    location /demo/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        # المسارات داخل العرض تنتهي بشرطة (`/demo/customer/`)
        try_files $uri $uri/ $uri/index.html =404;
    }

    # ── الصفحة العامة على الجذر ──
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
