# رؤوس الوكيل المشتركة.
#
# X-Forwarded-Proto هو ما يخبر Django أن الطلب الأصلي https رغم
# وصوله إلى الحاوية عبر http. المصدر الصحيح هو الوكيل الخارجي
# (Traefik) لا `$scheme` الخاص بنا: استخدام `$scheme` يكتب "http"
# فوق "https" القادم من Traefik، فيرى Django طلبًا غير آمن ويحوّله
# إلى https — الذي يعود إلى Traefik فيمرّره http من جديد. حلقة
# تحويل لا تنتهي، وهي أشهر عطل نشر خلف وكيل عكسي.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $walaee_forwarded_proto;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_read_timeout    30s;
