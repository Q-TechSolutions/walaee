# ══════════════════════════════════════════════════════════
#  ولائي — تركيبة الإنتاج
#  المرجع: docs/architecture/deployment.md
#
#  التشغيل من جذر المستودع:
#      docker compose -f infra/docker/docker-compose.prod.yml up -d
# ══════════════════════════════════════════════════════════
name: walaee

x-api-base: &api-base
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile.backend
  image: walaee-backend:latest
  env_file: [../../.env]
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_started}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    volumes:
      - ../nginx/walaee.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
      - static:/var/www/static:ro
      - media:/var/www/media:ro
    ports:
      - "8080:80"
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M}

  api:
    <<: *api-base
    volumes:
      - static:/app/staticfiles
      - media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}

  # عامل معزول للطابور الحسّاس: حملة رسائل ضخمة يجب ألا توقف
  # تدوير رموز الكاشير — docs/architecture/async-tasks.md
  worker-realtime:
    <<: *api-base
    command: celery -A config worker -Q realtime -c 4 --max-tasks-per-child 200
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

  worker-default:
    <<: *api-base
    command: >
      celery -A config worker
      -Q messaging,webhooks,analytics,billing,maintenance -c 2
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

  beat:
    <<: *api-base
    command: >
      celery -A config beat
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    # نسخة واحدة فقط — إلزامي. نسختان تعنيان تنفيذًا مزدوجًا لكل
    # مهمة مجدولة، أي منح نقاط مرتين وإرسال رسائل مرتين.
    deploy:
      replicas: 1
      resources:
        limits: {cpus: "0.1", memory: 256M}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-walaee}
      POSTGRES_USER: ${POSTGRES_USER:-walaee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?مطلوب}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-walaee}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 2G}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction مقصود: Redis هنا ليس كاشًا فقط. يحمل رموز نقاط
    # البيع وطوابير Celery، وطرد مفتاح منها يعني مسحًا فاشلًا عند
    # الكاشير أو مهمة ضائعة. الامتلاء يجب أن يُصرَخ به لا أن يُبتلَع.
    command: redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 256M}

volumes:
  pgdata:
  redisdata:
  static:
  media:
