<!doctype html>
<html lang="ar" dir="rtl">

    <!-- وسوم المشاركة: أول ما يراه من يصله الرابط في واتساب هو هذه

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ولائي" />
    <meta property="og:locale" content="ar_EG" />
    <meta property="og:title" content="ولائي — كلنا كسبانين" />

      content="بطاقات الولاء كلها في رقم هاتفك. ومتاجر في كل محافظة."

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"

    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
