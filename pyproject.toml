[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DJ", "S"]
ignore = [
    "E501",    # يتكفّل به black
    "S101",    # assert مسموح في الاختبارات
    "B008",    # شائع ومقصود في تواقيع DRF
    "DJ001",   # null=True على CharField مقصود في حقول اختيارية
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S", "E402"]
"conftest.py" = ["S"]
"tests/*" = ["S"]
"*/settings/*" = ["F403", "F405", "S105"]
# أوامر البذرة تولّد أرقامًا عشوائية للعرض لا للتشفير. S311 هنا
# ضجيج: استبدال `random` بـ `secrets` يفقدها ما تحتاجه فعلًا —
# بذرة ثابتة تجعل تشغيلين يعطيان نفس اللوحة.
"*/management/commands/seed_*.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "tests"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"
