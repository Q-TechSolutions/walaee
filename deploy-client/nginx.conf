server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;
    charset_types text/css text/plain application/javascript application/json image/svg+xml;

    absolute_redirect off;
    port_in_redirect  off;

    gzip on; gzip_vary on; gzip_comp_level 6; gzip_min_length 512; gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff font/woff2;

    add_header X-Content-Type-Options     "nosniff"                         always;
    add_header X-Frame-Options            "SAMEORIGIN"                      always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(self), microphone=(), geolocation=(self)" always;
    add_header X-Robots-Tag               "noindex, nofollow"               always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── حجب أي محاولة وصول للمحتوى غير المعروض ──
    # (غير موجود في الصورة أصلًا — هذه طبقة ثانية للاطمئنان)
    location ~* ^/(demo|plan|architecture|team|solutions|planning|project|docs)(/|$) {
        return 404;
    }
    location ~* Walaee_(Analysis|Executive) {
        return 404;
    }

    location ~* \.(?:css|js|svg|png|jpe?g|gif|ico|woff2?|ttf|eot)$ {
        add_header X-Content-Type-Options "nosniff" always;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.pdf$ {
        add_header X-Content-Type-Options "nosniff"   always;
        add_header X-Frame-Options       "SAMEORIGIN" always;
        add_header X-Robots-Tag          "noindex, nofollow" always;
        add_header Content-Disposition "inline";
        expires 1d;
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag           "noindex, nofollow"               always;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /index.html;

    location ~ /\. { deny all; access_log off; log_not_found off; }
}
