# ولائي — نسخة العميل · تُنشر على نطاق مستقل بمسار /
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: walaee-client:latest
    container_name: walaee-client
    restart: unless-stopped
    expose:
      - "80"
    environment:
      TZ: Africa/Cairo
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - "dokploy.app=walaee-client"
      - "traefik.enable=true"
      - "traefik.http.services.walaee-client.loadbalancer.server.port=80"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }
