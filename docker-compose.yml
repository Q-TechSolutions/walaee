# ============================================================
#  walaee — نشر نموذج العرض على Dokploy
#  Dokploy > Create > Compose > اربط المستودع واختر هذا الملف
# ============================================================
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: walaee-demo:latest
    container_name: walaee-demo
    restart: unless-stopped

    # Dokploy يوجّه الترافيك عبر Traefik تلقائيًا للمنفذ الداخلي 80.
    # لو بتشغّله محليًا أو محتاج منفذ مكشوف، فعّل السطرين التاليين:
    # ports:
    #   - "3000:80"
    expose:
      - "80"

    environment:
      TZ: Africa/Cairo

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - "dokploy.app=walaee-demo"
      - "traefik.enable=true"
      - "traefik.http.services.walaee-demo.loadbalancer.server.port=80"

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
