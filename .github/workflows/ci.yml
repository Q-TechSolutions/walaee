# خط الجودة — docs/architecture/deployment.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: config.settings.test

jobs:
  quality:
    name: التنسيق والأنماط
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - run: pip install -r backend/requirements/dev.txt

      - name: ruff
        run: ruff check backend

      - name: black
        run: black --check backend

  tests:
    name: الاختبارات والتغطية
    runs-on: ubuntu-latest

    services:
      # PostgreSQL حقيقي لا SQLite: اختبارات التزامن تعتمد على
      # SELECT FOR UPDATE وسلوك القفل الفعلي.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: walaee
          POSTGRES_USER: walaee
          POSTGRES_PASSWORD: walaee
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U walaee"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: walaee
      POSTGRES_USER: walaee
      POSTGRES_PASSWORD: walaee
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - run: pip install -r backend/requirements/dev.txt

      - name: هجرات غير مولَّدة
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      # القاعدة المعمارية تخصّ المحرك: كل سطر يمسّ الرصيد.
      # التقارير والعروض في نفس التطبيق لكنها قراءة فقط، ولها بوابة
      # أدنى منفصلة حتى لا تميّع الرقم الأهم في المشروع.
      - name: محرك القيود — ١٠٠٪ إلزامية
        working-directory: backend
        run: |
          pytest apps/ledger \
            --cov=apps.ledger.services --cov=apps.ledger.models \
            --cov-report=term-missing --cov-fail-under=100

      - name: تطبيق القيود كاملًا — ٩٥٪
        working-directory: backend
        run: pytest apps/ledger --cov=apps.ledger --cov-fail-under=95

      - name: كل الاختبارات
        working-directory: backend
        run: pytest --cov=apps --cov-report=xml --cov-report=term

      - name: مخطط OpenAPI يُولَّد بلا أخطاء
        working-directory: backend
        run: python manage.py spectacular --file /tmp/openapi.yaml --fail-on-warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  build:
    name: بناء صورة الإنتاج
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: بناء
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: false
          tags: walaee-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
