server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;

    # تحويلات نسبية: تحافظ على المنفذ والنطاق الصحيحين خلف بروكسي Dokploy/Traefik
    absolute_redirect off;
    port_in_redirect  off;
    charset_types text/css text/plain application/javascript application/json image/svg+xml;

    # ---------- الضغط ----------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff font/woff2;

    # ---------- رؤوس الأمان ----------
    add_header X-Content-Type-Options     "nosniff"                        always;
    # SAMEORIGIN إلزامي: العرض التقديمي يضمّن الواجهات داخل iframes من نفس الأصل
    add_header X-Frame-Options            "SAMEORIGIN"                     always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(self), microphone=(), geolocation=(self)" always;

    # ---------- الجذر يحوّل إلى المعرض ----------
    location = / {
        return 302 /demo/;
    }

    # ---------- فحص صحي لـ Dokploy ----------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------- أصول ثابتة: كاش طويل ----------
    location ~* \.(?:css|js|svg|png|jpe?g|gif|ico|woff2?|ttf|eot)$ {
        add_header X-Content-Type-Options "nosniff" always;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
        try_files $uri =404;
    }

    # ---------- التقارير: تُفتح داخل المتصفح لا تُنزَّل ----------
    location ~* \.pdf$ {
        add_header X-Content-Type-Options "nosniff"   always;
        add_header X-Frame-Options       "SAMEORIGIN" always;
        add_header Content-Disposition "inline";
        add_header Cache-Control "public, max-age=86400";
        expires 1d;
        try_files $uri =404;
    }

    # ---------- HTML: بدون كاش حتى تظهر التحديثات فورًا ----------
    location ~* \.html$ {
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "camera=(self), microphone=(), geolocation=(self)" always;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # ---------- صفحات الخطأ ----------
    error_page 404 /demo/index.html;

    # ---------- منع الوصول للملفات المخفية ----------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
