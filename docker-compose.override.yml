# ══════════════════════════════════════════════════════════
#  ولائي — الوصول المباشر بلا وكيل عكسي
#
#  Compose يحمّل هذا الملف **تلقائيًا** فوق `docker-compose.yml`
#  عند `docker compose up` بلا `-f`، ويتجاهله كليًا حين يُمرَّر
#  `-f docker-compose.yml` صراحةً — وهو ما تفعله منصّات النشر.
#
#  فالنتيجة بلا أي إعداد من أحد:
#      محليًا      →  التطبيق على http://127.0.0.1:${WEB_PORT}
#      على المنصّة →  لا منفذ منشور، وTraefik يوجّه النطاق عبر الشبكة
#
#  وهذا ما يمنع عطلين معًا: تعارض المنافذ على خادم مشترك
#  («port is already allocated»)، وفتح التطبيق على http متجاوزًا
#  شهادة Traefik.
#
#  لنشر على خادم بلا وكيل عكسي مرّر الملفين صراحةً:
#      docker compose -f docker-compose.yml -f docker-compose.override.yml up -d
# ══════════════════════════════════════════════════════════

services:
  web:
    ports:
      - "${WEB_PORT:-8081}:80"
