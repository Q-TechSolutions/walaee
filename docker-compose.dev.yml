# ══════════════════════════════════════════════════════════
#  ولائي — قاعدة البيانات والكاش للتطوير المحلي فقط
#
#  التشغيل:  make up      (أو docker compose -f docker-compose.dev.yml up -d)
#
#  لا تطبيق هنا عمدًا: `make run` يشغّل Django على المضيف مباشرةً
#  فيعمل إعادة التحميل التلقائي ونقاط التوقّف. والمنفذان منشوران
#  (‏5433 و6380) لأن الخادم على المضيف يصل إليهما من الخارج.
#
#  الستاك الكامل — الواجهات والخلفية والعمّال — في
#  `docker-compose.yml` بجذر المستودع. هو ملف النشر الوحيد.
# ══════════════════════════════════════════════════════════
name: walaee-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: walaee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-walaee}
      POSTGRES_USER: ${POSTGRES_USER:-walaee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-walaee}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-walaee}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: walaee-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
